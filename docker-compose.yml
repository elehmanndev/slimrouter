services:
  slimrouter:
    image: ghcr.io/elehmanndev/slimrouter:latest
    build: .
    container_name: slimrouter
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
